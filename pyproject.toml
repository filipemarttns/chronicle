[project]
name = "chronicle"
version = "0.1.0"
description = "Developer Memory Engine"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Filipe Martins", email = "filipemarttns@gmail.com" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.0",
  "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
]

[tool.uv.workspace]
members = [
  "packages/domain",
  "packages/application",
  "packages/adapters",
  "apps/api",
]

[tool.pytest.ini_options]
pythonpath = [
  "packages/domain/src",
  "packages/application/src",
  "packages/adapters/src",
  "apps/api/src",
]
testpaths = ["packages", "apps", "tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
