[project]
name = "chronicle-api"
version = "0.1.0"
description = "Chronicle FastAPI service"
requires-python = ">=3.14"
dependencies = [
  "chronicle-domain",
  "chronicle-application",
  "chronicle-adapters",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronicle_api"]
