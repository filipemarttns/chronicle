services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chronicle
      POSTGRES_PASSWORD: chronicle
      POSTGRES_DB: chronicle
    ports:
      - "5432:5432"
    volumes:
      - chronicle_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronicle -d chronicle"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      CHRONICLE_ENV: local
      CHRONICLE_STORE: postgres
      CHRONICLE_SYNC_PROJECT: "true"
      # Local Compose defaults to open auth so the web console works without bootstrap.
      # Set CHRONICLE_AUTH_MODE=token (and issue a bearer) for a locked-down stack.
      CHRONICLE_AUTH_MODE: ${CHRONICLE_AUTH_MODE:-dev}
      CHRONICLE_BOOTSTRAP_TOKEN: ${CHRONICLE_BOOTSTRAP_TOKEN:-change-me-bootstrap}
      CHRONICLE_AUTH_PEPPER: ${CHRONICLE_AUTH_PEPPER:-change-me-pepper}
      CHRONICLE_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      EMBEDDING_PROVIDER: hashing
      DATABASE_URL: postgresql+psycopg://chronicle:chronicle@postgres:5432/chronicle
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    command: celery -A chronicle_worker.celery_app.celery_app worker -B -l INFO
    environment:
      CHRONICLE_STORE: postgres
      DATABASE_URL: postgresql+psycopg://chronicle:chronicle@postgres:5432/chronicle
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app/apps/worker/src:/app/packages/domain/src:/app/packages/application/src:/app/packages/adapters/src:/app/apps/api/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - ../../apps/web:/app
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0 -p 3000"
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_CHRONICLE_API_URL: http://localhost:8000
      NEXT_PUBLIC_CHRONICLE_API_TOKEN: ${NEXT_PUBLIC_CHRONICLE_API_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy

volumes:
  chronicle_pg:
