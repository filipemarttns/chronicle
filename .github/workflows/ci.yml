name: ci

on:
  push:
    branches: [main, "release/**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi uvicorn pydantic httpx "sqlalchemy>=2.0" "psycopg[binary]" pgvector alembic celery redis
          pip install -e packages/domain -e packages/application -e packages/adapters -e apps/api
      - name: Test
        env:
          CHRONICLE_STORE: memory
          CHRONICLE_AUTH_MODE: dev
          PYTHONPATH: packages/domain/src:packages/application/src:packages/adapters/src:apps/api/src:apps/worker/src:apps/mcp/src
        run: python -m pytest -q

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose files
        run: |
          docker compose -f compose.yaml config >/dev/null
          docker compose -f deploy/docker/docker-compose.yml config >/dev/null

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and typecheck
        run: |
          npm install
          npx tsc --noEmit
