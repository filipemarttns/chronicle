name: ci

on:
  push:
    branches: [main, "release/**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi uvicorn pydantic httpx "sqlalchemy>=2.0" "psycopg[binary]" pgvector alembic celery redis
          pip install -e packages/domain -e packages/application -e packages/adapters -e apps/api
      - name: Test
        env:
          CHRONICLE_STORE: memory
        run: python -m pytest -q
