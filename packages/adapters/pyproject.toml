[project]
name = "chronicle-adapters"
version = "0.1.0"
description = "Chronicle infrastructure adapters"
requires-python = ">=3.14"
dependencies = ["chronicle-domain", "chronicle-application"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronicle_adapters"]
